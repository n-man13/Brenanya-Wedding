<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Table</title>
  <!-- Google Fonts for Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- PapaParse for Easy CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --primary-text: #2c3e50;
      --accent-color: #8a735c;
      --border-color: #e2dcd5;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 36px 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 28px;
    }

    .search-wrapper {
      margin-bottom: 24px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #fafafa;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(138, 115, 92, 0.15);
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Custom scrollbar */
    .results-container::-webkit-scrollbar {
      width: 6px;
    }
    .results-container::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 3px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background-color: #faf8f5;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      text-align: left;
      animation: fadeIn 0.2s ease-in-out;
    }

    .result-info {
      display: flex;
      flex-direction: column;
    }

    .guest-name {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--primary-text);
    }

    .table-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .table-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #777;
    }

    .table-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-color);
      line-height: 1;
    }

    .no-results {
      color: #888;
      font-size: 0.95rem;
      padding: 16px;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome</h1>
    <p class="subtitle">Start typing your name to find your table assignment.</p>

    <div class="search-wrapper">
      <label for="name-input">Your Name</label>
      <input type="text" id="name-input" placeholder="Type first or last name..." autocomplete="off">
    </div>

    <div id="results-container" class="results-container"></div>
  </div>

  <script>
    let seatingData = [];

    // Load CSV file on page start
    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse('data.csv', {
        download: true,
        header: false, // Set to false because data.csv has no header row
        skipEmptyLines: true,
        complete: function(results) {
          // Process array rows: index 0 is Name, index 1 is Table Number
          seatingData = results.data.map(row => {
            return {
              name: row[0] ? row[0].trim() : '',
              table: row[1] ? row[1].trim() : 'N/A'
            };
          });
        },
        error: function(err) {
          console.error("Could not load seating data:", err);
        }
      });
    });

    const input = document.getElementById('name-input');
    const resultsContainer = document.getElementById('results-container');

    input.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();
      resultsContainer.innerHTML = '';

      if (query.length === 0) {
        return;
      }

      // Filter matches containing typed query
      const matches = seatingData.filter(item => {
        return item.name.toLowerCase().includes(query);
      });

      if (matches.length > 0) {
        matches.forEach(match => {
          const card = document.createElement('div');
          card.className = 'result-row';

          card.innerHTML = `
            <div class="result-info">
              <span class="guest-name">${escapeHtml(match.name)}</span>
            </div>
            <div class="table-badge">
              <span class="table-label">Table</span>
              <span class="table-number">${escapeHtml(match.table)}</span>
            </div>
          `;
          resultsContainer.appendChild(card);
        });
      } else {
        resultsContainer.innerHTML = `<div class="no-results">No guests found matching "${escapeHtml(this.value)}"</div>`;
      }
    });

    // Helper to prevent HTML injection issues
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
